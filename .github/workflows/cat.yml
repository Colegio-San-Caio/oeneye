name: cat catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run cat.py
        run: python3 cat.py
      - name: Commit CATALOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CATALOG.md
          git diff --staged --quiet || (git commit -m "auto: update CATALOG.md" && git push)
